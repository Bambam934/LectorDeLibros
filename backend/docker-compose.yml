services:
  postgres:
    image: postgres:16
    container_name: lectorsync-postgres
    environment:
      POSTGRES_DB: lectorsync
      POSTGRES_USER: lectorsync_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env antes de levantar}
    ports:
      # 127.0.0.1: la DB solo es accesible desde el host por seguridad.
      # El backend la alcanza por la red interna de Docker (hostname: postgres).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lectorsync_app -d lectorsync"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lectorsync_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lectorsync-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Importante: usa el hostname 'postgres' (no 127.0.0.1) — es el nombre
      # del servicio en la red interna de Docker.
      DATABASE_URL: postgresql://lectorsync_app:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env antes de levantar}@postgres:5432/lectorsync
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env (min 32 chars) antes de levantar}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      ELEVENLABS_DEFAULT_VOICE_ID: ${ELEVENLABS_DEFAULT_VOICE_ID:-}
      ELEVENLABS_ALLOWED_VOICE_IDS: ${ELEVENLABS_ALLOWED_VOICE_IDS:-}
      TTS_DAILY_CHAR_QUOTA: ${TTS_DAILY_CHAR_QUOTA:-200000}
      TTS_RATE_LIMIT_MAX: ${TTS_RATE_LIMIT_MAX:-10}
      # Con cloudflared en el host, sus peticiones llegan desde la pasarela de
      # la red de Docker: TRUST_PROXY=172.16.0.0/12 (o la subred concreta).
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      # Solo en el propio PC: el backend habla HTTP sin cifrar, y en la LAN
      # cualquiera de la misma Wi-Fi leería contraseñas y tokens. El celular
      # llega con `adb reverse tcp:3000 tcp:3000` (localhost en el móvil) y
      # la publicación hacia fuera va detrás de un proxy con TLS (p. ej. un
      # túnel de Cloudflare apuntando a 127.0.0.1:3000). Para una prueba
      # puntual en la LAN: BACKEND_BIND=0.0.0.0 docker compose up.
      - "${BACKEND_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lectorsync_net

volumes:
  postgres_data:

networks:
  lectorsync_net:
    driver: bridge
