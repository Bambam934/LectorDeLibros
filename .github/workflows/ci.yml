name: CI

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main, desarrollo]

# Cancela ejecuciones previas del mismo ref si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Fastify + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lectorsync
    steps:
      - uses: actions/checkout@v4
      # Versión fija, la misma del equipo de desarrollo (Dart 3.11.5, la que
      # pide pubspec). Con `channel: stable` a secas el CI pasó solo a 3.50,
      # que declara obsoleto package:flutter/material.dart y rompió
      # `flutter analyze` sin que cambiara el código. Subirla es una tarea
      # propia (migrar a package:material_ui), no un efecto secundario.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
